name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Prepare Project Structure & Missing Resources
      run: |
        mkdir -p app/src/main/java/com/whatsapp/clone/stealth/
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/drawable
        
        # إنشاء أيقونة وهمية بسيطة بصيغة XML لتجنب خطأ مفقودات الأيقونات
        mkdir -p app/src/main/res/mipmap-hdpi
        echo '<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#10B981" android:pathData="M12,2C6.48,2 2,6.48 2,12s4.48,10 10,10 10,-4.48 10,-10S17.52,2 12,2z"/></vector>' > app/src/main/res/drawable/ic_launcher_foreground.xml

        mv MainActivity.java app/src/main/java/com/whatsapp/clone/stealth/ || true
        mv StealthService.java app/src/main/java/com/whatsapp/clone/stealth/ || true
        mv AndroidManifest.xml app/src/main/AndroidManifest.xml || true

        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "VoiceChanger"
        include ':app'
        EOF

        echo "// Top-level build file" > build.gradle

        # تحديث ملف app/build.gradle واستخدام الـ Theme الافتراضي android:Theme.Light
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application' version '8.2.0'
        }
        android {
            namespace 'com.whatsapp.clone.stealth'
            compileSdk 34

            defaultConfig {
                applicationId 'com.whatsapp.clone.stealth'
                minSdk 21
                targetSdk 34
                versionCode 1
                versionName '1.0'
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
        dependencies {
            implementation 'com.squareup.okhttp3:okhttp:4.11.0'
        }
        EOF

        # ملف strings وملف styles لتوفير الثيم الافتراضي وتجنب أي خطأ أداة ربط
        echo '<resources><string name="app_name">Voice Changer</string><style name="AppTheme" parent="android:Theme.Light.NoTitleBar"><item name="android:windowBackground">#091F14</item></style></resources>' > app/src/main/res/values/styles.xml

        # تحديث Manifest برمجيًا للتأكد من ربط الثيم الجديد الخالي من أي تعارض
        sed -i 's|android:theme="@style/Theme.AppCompat.Light.DarkActionBar"|android:theme="@style/AppTheme"|g' app/src/main/AndroidManifest.xml || true

    - name: Download Android SDK & Build APK
      run: |
        export ANDROID_HOME=$HOME/android-sdk
        mkdir -p $ANDROID_HOME
        
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdtools.zip
        mkdir -p $ANDROID_HOME/cmdline-tools/latest
        unzip -q cmdtools.zip -d $ANDROID_HOME/temp_tools
        mv $ANDROID_HOME/temp_tools/cmdline-tools/* $ANDROID_HOME/cmdline-tools/latest/
        rm -rf cmdtools.zip $ANDROID_HOME/temp_tools

        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools

        yes | sdkmanager --licenses || true
        sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

        echo "sdk.dir=$ANDROID_HOME" > local.properties

        wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
        unzip -q gradle-8.2-bin.zip

        ./gradle-8.2/bin/gradle assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
