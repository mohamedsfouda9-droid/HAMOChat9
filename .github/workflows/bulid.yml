name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Prepare Project Structure & Working Environment
      run: |
        mkdir -p app/src/main/java/com/whatsapp/clone/stealth/
        mkdir -p app/src/main/res/values
        
        mv MainActivity.java app/src/main/java/com/whatsapp/clone/stealth/ || true
        mv StealthService.java app/src/main/java/com/whatsapp/clone/stealth/ || true
        mv AndroidManifest.xml app/src/main/AndroidManifest.xml || true

        echo "include ':app'" > settings.gradle

        # كتابة إعدادات Gradle متوافقة ومبسطة جداً لتجنب أي تعارض
        cat << 'EOF' > build.gradle
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }
        android {
            namespace 'com.whatsapp.clone.stealth'
            compileSdk 33

            defaultConfig {
                applicationId 'com.whatsapp.clone.stealth'
                minSdk 21
                targetSdk 33
                versionCode 1
                versionName '1.0'
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.squareup.okhttp3:okhttp:4.9.3'
        }
        EOF

        echo '<resources><string name="app_name">Voice Changer</string></resources>' > app/src/main/res/values/strings.xml

    - name: Download Android SDK & Build via Command Line Tools
      run: |
        export ANDROID_HOME=$HOME/android-sdk
        mkdir -p $ANDROID_HOME
        
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdtools.zip
        mkdir -p $ANDROID_HOME/cmdline-tools/latest
        unzip -q cmdtools.zip -d $ANDROID_HOME/temp_tools
        mv $ANDROID_HOME/temp_tools/cmdline-tools/* $ANDROID_HOME/cmdline-tools/latest/
        rm -rf cmdtools.zip $ANDROID_HOME/temp_tools

        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools

        yes | sdkmanager --licenses || true
        sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

        # استخدام أداة البناء بشكل مباشر وتوليد ملفات الكلاس وتجميع الـ APK
        # سنقوم بتوليد حزمة APK نظيفة ومستقرة
        echo "sdk.dir=$ANDROID_HOME" > local.properties

        # تثبيت حزمة أداة البناء البديلة المستقرة
        wget -q https://services.gradle.org/distributions/gradle-8.0-bin.zip
        unzip -q gradle-8.0-bin.zip
        sudo mv gradle-8.0 /opt/gradle
        export PATH=$PATH:/opt/gradle/bin

        gradle assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
