herename: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Create Gradle Project Structure
      run: |
        mkdir -p app/src/main/java/com/whatsapp/clone/stealth/
        mkdir -p app/src/main/res/values
        
        mv MainActivity.java app/src/main/java/com/whatsapp/clone/stealth/ || true
        mv StealthService.java app/src/main/java/com/whatsapp/clone/stealth/ || true
        mv AndroidManifest.xml app/src/main/AndroidManifest.xml || true

        echo "rootProject.name='VoiceChanger'
        include ':app'" > settings.gradle

        echo "buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:7.4.2'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }" > build.gradle

        echo "plugins {
            id 'com.android.application'
        }
        android {
            namespace 'com.whatsapp.clone.stealth'
            compileSdk 33

            defaultConfig {
                applicationId 'com.whatsapp.clone.stealth'
                minSdk 21
                targetSdk 33
                versionCode 1
                versionName '1.0'
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.squareup.okhttp3:okhttp:4.9.3'
        }" > app/build.gradle

        echo '<resources><string name="app_name">Voice Changer</string></resources>' > app/src/main/res/values/strings.xml

    - name: Build APK with Gradle
      run: |
        gradle wrapper
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
