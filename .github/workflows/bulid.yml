name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Prepare Project Structure & Files
      run: |
        mkdir -p app/src/main/java/com/whatsapp/clone/stealth/
        mkdir -p app/src/main/res/values
        
        mv MainActivity.java app/src/main/java/com/whatsapp/clone/stealth/ || true
        mv StealthService.java app/src/main/java/com/whatsapp/clone/stealth/ || true
        mv AndroidManifest.xml app/src/main/AndroidManifest.xml || true

        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "VoiceChanger"
        include ':app'
        EOF

        echo "// Top-level build file" > build.gradle

        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application' version '8.1.1'
        }
        android {
            namespace 'com.whatsapp.clone.stealth'
            compileSdk 34

            defaultConfig {
                applicationId 'com.whatsapp.clone.stealth'
                minSdk 21
                targetSdk 34
                versionCode 1
                versionName '1.0'
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.squareup.okhttp3:okhttp:4.9.3'
        }
        EOF

        echo '<resources><string name="app_name">Voice Changer</string></resources>' > app/src/main/res/values/strings.xml

    - name: Setup Gradle Wrapper (Version 8.2) & Build APK
      run: |
        export ANDROID_HOME=$HOME/android-sdk
        mkdir -p $ANDROID_HOME
        
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdtools.zip
        mkdir -p $ANDROID_HOME/cmdline-tools/latest
        unzip -q cmdtools.zip -d $ANDROID_HOME/temp_tools
        mv $ANDROID_HOME/temp_tools/cmdline-tools/* $ANDROID_HOME/cmdline-tools/latest/
        rm -rf cmdtools.zip $ANDROID_HOME/temp_tools

        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools

        yes | sdkmanager --licenses || true
        sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

        echo "sdk.dir=$ANDROID_HOME" > local.properties

        # توليد ملف الwrapper بالنسخة 8.2 لتثبيت بيئة بناء نظيفة وبعيدة تماماً عن Gradle 9
        gradle wrapper --gradle-version 8.2

        # استخدام gradlew للتشغيل الفعلي وتجنب أمر النظام الإجباري
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
