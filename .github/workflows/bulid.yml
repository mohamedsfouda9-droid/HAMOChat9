name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Create Gradle Project Structure
      run: |
        mkdir -p app/src/main/java/com/whatsapp/clone/stealth/
        mkdir -p app/src/main/res/values
        
        mv MainActivity.java app/src/main/java/com/whatsapp/clone/stealth/ || true
        mv StealthService.java app/src/main/java/com/whatsapp/clone/stealth/ || true
        mv AndroidManifest.xml app/src/main/AndroidManifest.xml || true

        echo "rootProject.name='VoiceChanger'
        include ':app'" > settings.gradle

        echo "allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }" > build.gradle

        echo "buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:7.4.2'
            }
        }" >> build.gradle

        echo "plugins {
            id 'com.android.application'
        }
        android {
            namespace 'com.whatsapp.clone.stealth'
            compileSdk 33

            defaultConfig {
                applicationId 'com.whatsapp.clone.stealth'
                minSdk 21
                targetSdk 33
                versionCode 1
                versionName '1.0'
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.squareup.okhttp3:okhttp:4.9.3'
        }" > app/build.gradle

        echo '<resources><string name="app_name">Voice Changer</string></resources>' > app/src/main/res/values/strings.xml

    - name: Download Android SDK Command Line Tools & Build
      run: |
        # تثبيت حزم أدوات البناء الرسمية واستخدام أداة البناء بشكل مباشر
        export ANDROID_HOME=$HOME/android-sdk
        mkdir -p $ANDROID_HOME
        
        # تحميل واستخراج Command Line Tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdtools.zip
        mkdir -p $ANDROID_HOME/cmdline-tools/latest
        unzip -q cmdtools.zip -d $ANDROID_HOME/temp_tools
        mv $ANDROID_HOME/temp_tools/cmdline-tools/* $ANDROID_HOME/cmdline-tools/latest/
        rm -rf cmdtools.zip $ANDROID_HOME/temp_tools

        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools

        # قبول التراخيص وتثبيت الحزم المطلوبة للبناء
        yes | sdkmanager --licenses || true
        sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

        # كتابة ملف local.properties لتحديد مسار الـ SDK
        echo "sdk.dir=$ANDROID_HOME" > local.properties

        # تجميع المشروع مباشرة عبر الأداة
        gradle assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
